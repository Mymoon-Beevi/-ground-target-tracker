yolo:
  model_path: "models/yolov8n.pt"   # .pt or .engine (TensorRT-exported)
  input_size: 640
  confidence_threshold: 0.30
  nms_iou_threshold: 0.45
  # Ground target classes (COCO IDs). Empty list = all classes.
  # 0=person 1=bicycle 2=car 3=motorcycle 5=bus 7=truck
  classes: [0, 1, 2, 3, 5, 7]
  device: "cuda"               # "cuda" or "cpu"

targeting:
  selection_mode: "nearest_center"   # nearest_center | largest | highest_conf | manual
  smoothing_alpha: 0.3
  camera_fov_h_deg: 60.0
  camera_fov_v_deg: 34.0
  camera_fx: 1066.67
  camera_fy: 1066.67
  camera_cx: 640.0
  camera_cy: 360.0

tracker:
  fps: 30.0
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8

ui:
  show_fps: true
  show_trajectories: true
  show_reticle: true
  show_error_signal: true
  trajectory_history: 40
